name: Android port (arm64 verification)

on:
  push:
    branches: [port/android-qt-parity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Compile changed entrypoints and Python modules
        run: |
          python -m compileall -q main.py simple_android.py TiktokStreamKeyGenerator.py Libs tests/test_android_port.py tests/test_simple_android_stream.py
      - name: Run Android compatibility unit tests
        run: |
          python -m pip install requests
          python -m unittest -v tests.test_android_port tests.test_android_build_spec tests.test_android_elf_audit tests.test_live_start_safety tests.test_cookie_payload tests.test_android_lifecycle tests.test_android_sei tests.test_simple_android_stream

  package-debug-apk:
    needs: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 16-KiB-compatible build toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y zip unzip libffi-dev libssl-dev libltdl-dev autoconf automake libtool pkg-config libdouble-conversion3 libgl1 libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libdbus-1-3
          # Buildozer 1.6 still probes the old SDK tools/bin path.
          # Use a forwarding wrapper; do not copy the actual command-line tools.
          SDKMANAGER="$(command -v sdkmanager)"
          mkdir -p "$ANDROID_HOME/tools/bin"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$SDKMANAGER" > "$ANDROID_HOME/tools/bin/sdkmanager"
          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"
      - name: Prepare supported Qt for Python Android wheels
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'PySide6==6.12.0'
          python -m pip install -r requirements-android.txt
          # Fail quickly if the application cannot even import with Android
          # settings and no curl_cffi (the Android signer transport path).
          mkdir -p "$RUNNER_TEMP/tiktok-android-private"
          ANDROID_PRIVATE="$RUNNER_TEMP/tiktok-android-private" QT_QPA_PLATFORM=offscreen \
            python -c "import TiktokStreamKeyGenerator; from Libs.android_proxy import AndroidProxyProcess; print('Android-mode Python imports PASS')"
          python -m pip install -r "$(python - <<'PY'
          import pathlib, PySide6
          print(pathlib.Path(PySide6.__file__).parent / "scripts" / "requirements-android.txt")
          PY
          )"
          mkdir -p android-wheels
          curl --fail --location --retry 3 --silent --show-error \
            'https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl' \
            --output 'android-wheels/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl'
          curl --fail --location --retry 3 --silent --show-error \
            'https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl' \
            --output 'android-wheels/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl'
          for wheel in android-wheels/*.whl; do unzip -tq "$wheel"; done
      - name: Exercise PC LIVE endpoints without credentials or network calls
        run: |
          mkdir -p "$RUNNER_TEMP/tiktok-android-private"
          ANDROID_PRIVATE="$RUNNER_TEMP/tiktok-android-private" QT_QPA_PLATFORM=offscreen \
            python -m unittest -v tests.test_android_live_contract tests.test_android_gui_smoke tests.test_android_modal_surfaces tests.test_android_qr tests.test_android_tools
      - name: Run complete offline functional regression suite
        run: |
          python -m pip install -r requirements-test.txt 'curl_cffi>=0.15.0' truststore
          python scripts/run_tests.py
      - name: Stage pinned native arm64 FFmpeg
        run: |
          set -euo pipefail
          mkdir -p android-native/arm64-v8a
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/hzw1199/Android-FFmpeg-Prebuilt/90231cc0105aef4f76926b911535f5eb73511b86/ffmpeg-9.0/bin/ffmpeg' \
            --output android-native/arm64-v8a/libffmpeg_exec.so
          test "$(git hash-object android-native/arm64-v8a/libffmpeg_exec.so)" = "602b24c9e967863ff608a685eaaad10ea6711758"
          readelf -h android-native/arm64-v8a/libffmpeg_exec.so | grep -q 'AArch64'
      - name: Build arm64 Qt Android package (bootstrap verification only)
        run: |
          set -euo pipefail
          PYSIDE_WHEEL="$(find android-wheels -type f -iname 'pyside6-*-android_aarch64.whl' | head -1)"
          SHIBOKEN_WHEEL="$(find android-wheels -type f -iname 'shiboken6-*-android_aarch64.whl' | head -1)"
          if [[ -z "$PYSIDE_WHEEL" || -z "$SHIBOKEN_WHEEL" ]]; then
            echo 'Required official Qt Android wheels were not downloaded' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import sys
          import PySide6
          sys.path.insert(0, str(Path(PySide6.__file__).parent / "scripts"))
          from deploy_lib.android.android_helper import get_wheel_android_arch
          from deploy_lib.android.android_utilities import SUPPORTED_ANDROID_PLATFORMS
          print("Qt supported Android architectures:", SUPPORTED_ANDROID_PLATFORMS)
          for wheel in sorted(Path("android-wheels").rglob("*.whl")):
              print("WHEEL:", wheel.name, "ARCH:", get_wheel_android_arch(wheel))
          PY
          echo "PYSIDE_WHEEL=$PYSIDE_WHEEL"
          echo "SHIBOKEN_WHEEL=$SHIBOKEN_WHEEL"
          # Create Qt recipes/spec before altering Python requirements, otherwise
          # the default Qt generator silently packages only shiboken6/PySide6.
          pyside6-android-deploy --init --keep-deployment-files -f --name 'TikTokStreamKeyGenerator' \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --ndk-path="$ANDROID_HOME/ndk/28.2.13676358" \
            --sdk-path="$ANDROID_HOME" \
            --extra-modules="Svg,Network"
          python scripts/configure_android_buildozer.py buildozer.spec
          # Qt's deploy launcher deletes buildozer.spec on every invocation.
          # Build directly after --init so the tested app dependency edits survive.
          # Plain pip wheel selection on the Linux host can copy x86_64
          # charset-normalizer speedups into an Android Python bundle.
          # Source builds keep the package's pure-Python fallback.
          PIP_NO_BINARY=charset-normalizer CHARSET_NORMALIZER_USE_CYTHON=0 python -m buildozer android debug
          # p4a installs pure-Python requirements with --no-deps. Without
          # explicit requests dependencies, this APK can crash at import time.
          BUNDLE_DIR="$(find .buildozer/android/platform -type d -path '*/_python_bundle/site-packages' -print -quit)"
          test -n "$BUNDLE_DIR" && test -d "$BUNDLE_DIR"
          for package in requests urllib3 idna certifi charset_normalizer websockets; do
            test -d "$BUNDLE_DIR/$package" || { echo "Missing Android Python dependency: $package" >&2; exit 1; }
          done
          test -f "$BUNDLE_DIR/certifi/cacert.pem"
          python scripts/audit_android_python_bundle.py "$BUNDLE_DIR"
          find . -name '*.apk' -type f -print
          APK="$(find . -name '*.apk' -type f | head -1)"
          test -n "$APK" && test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libffmpeg_exec.so'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'
          echo 'APK contains FFmpeg and INTERNET permission; runtime parity remains unverified.'
      - name: Archive debug bootstrap APK for internal diagnosis
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-arm64-bootstrap-NOT-LIVE-VERIFIED
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 7
