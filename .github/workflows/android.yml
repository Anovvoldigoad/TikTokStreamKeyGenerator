name: Android port (arm64 verification)

on:
  push:
    branches: [port/android-qt-parity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Compile changed entrypoints and Python modules
        run: |
          python -m compileall -q main.py TiktokStreamKeyGenerator.py Libs tests/test_android_port.py
      - name: Run Android compatibility unit tests
        run: |
          python -m pip install requests
          python -m unittest -v tests.test_android_port

  package-debug-apk:
    needs: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16-KiB-compatible build toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y zip unzip libffi-dev libssl-dev autoconf automake libtool pkg-config
      - name: Prepare supported Qt for Python Android wheels
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'PySide6==6.12.0' qtpip
          python -m pip install -r requirements-android.txt
          mkdir -p android-wheels
          cd android-wheels
          qtpip download 'PySide6==6.12.0' --android --arch aarch64
      - name: Build arm64 Qt Android package (bootstrap verification only)
        run: |
          set -euo pipefail
          PYSIDE_WHEEL="$(find android-wheels -type f -iname 'pyside6-*-android_aarch64.whl' | head -1)"
          SHIBOKEN_WHEEL="$(find android-wheels -type f -iname 'shiboken6-*-android_aarch64.whl' | head -1)"
          test -n "$PYSIDE_WHEEL" && test -n "$SHIBOKEN_WHEEL"
          pyside6-android-deploy -f --name 'TikTokStreamKeyGenerator' \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --ndk-path="$ANDROID_HOME/ndk/28.2.13676358" \
            --sdk-path="$ANDROID_HOME" \
            --extra-modules="Svg,Network"
          find . -name '*.apk' -type f -print
          test "$(find . -name '*.apk' -type f | wc -l)" -ge 1
      - name: Archive debug bootstrap APK for internal diagnosis
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-arm64-bootstrap-NOT-LIVE-VERIFIED
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 7
